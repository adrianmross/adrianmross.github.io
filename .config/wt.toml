[[pre-start]]
copy = "wt step copy-ignored"
direnv = "direnv allow ."

[[pre-merge]]
typecheck = "pnpm run typecheck"
lint = "pnpm run lint"
build = "pnpm run build"

[aliases]
dev = "pnpm exec portless run"

[step.copy-ignored]
# These caches contain worktree paths or output that is cheap to regenerate.
exclude = [".devenv/", ".direnv/", ".next/", "out/", ".cache/", "tsconfig.tsbuildinfo"]
